# JXC 演示站（阶段二：已备案 + 已绑域名 + HTTPS）
#
# 部署位置：/etc/nginx/conf.d/jxc.conf
# 前提：本文件是发行版默认块的「兄弟」文件；conf.d/*.conf 在 nginx.conf 的默认
#       server 块之前被 include，所以本文件里的 80 段就是该端口的默认站点。
#
# 阶段一（备案前、无域名）怎么用：把下面 80 段整体替换成
#       server { listen 127.0.0.1:8080; server_name _; ... }  <- 见文末附录
#
# 证书：certbot（EPEL 包）签发，路径由 /etc/letsencrypt/live/ 管理，
#       续期由 certbot-renew.timer 负责，renewal-hooks/deploy 里 reload nginx。
#       （acme.sh 需要访问 raw.githubusercontent.com，国内服务器通常装不上，故不用。）

# ---------- 80：只做 ACME 验证 + 301 跳转 ----------
server {
    listen      80;
    listen      [::]:80;
    server_name td-b.xyz www.td-b.xyz 8.134.104.223;
    server_tokens off;

    # Let's Encrypt HTTP-01 验证目录。放在 web 根之外，
    # 这样 upgrade.sh 的 rm -rf /opt/jxc/web/* 不会误删正在验证的挑战文件。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    # 除验证路径外一律跳 HTTPS（IP 访问也跳，避免明文传播密码）
    location / {
        return 301 https://td-b.xyz$request_uri;
    }
}

# ---------- 443：正式站点 ----------
server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name td-b.xyz www.td-b.xyz;

    ssl_certificate     /etc/letsencrypt/live/td-b.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/td-b.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    # 注意：nginx 的 add_header 不向下继承——location 内一旦出现任何 add_header，
    # server 级的 add_header 在该 location 内全部失效。因此 HSTS 必须逐 location 重复声明。
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /opt/jxc/web;
    index index.html;
    server_tokens off;
    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8888/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 第二道防线：初始化与 Swagger 即便在配置里误开，也不对外
    location ^~ /api/init/ { return 404; }
    location ^~ /api/swagger { return 404; }
}

